[versions]
agp = "8.1.4"
core = "3.5.1"
kotlin = "1.9.10"
appcompat = "1.6.1"
material = "1.9.0"
constraintlayout = "2.1.4"
camerax = "1.3.1"
camerax-view = "1.3.1"
mlkit-barcode = "17.2.0"
junit = "4.13.2"
junit-ext = "1.1.5"
espresso = "3.5.1"
activity = "1.8.0"  # CHANGED FROM 1.12.2 to 1.8.0
core-ktx = "1.12.0"  # ADDED
zxing-android-embedded = "4.3.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
core = { module = "com.google.zxing:core", version.ref = "core" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

# CameraX
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax-view" }

# ML Kit
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }

# Core libraries
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }  # ADDED
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junit-ext" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-android-embedded" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }